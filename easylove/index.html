<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2eb">
  <title>EasyLove 键盘 · 帮助与隐私</title>
  <style>
    :root{color-scheme:light;--paper:#f5f2eb;--ink:#242622;--muted:#666a62;--line:#dedbd2;--green:#395b4b}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(720px,100% - 36px);margin:0 auto;padding:72px 0 56px}h1{font-size:clamp(32px,8vw,52px);line-height:1.15;letter-spacing:-.04em;margin:14px 0}p{color:var(--muted)}.eyebrow{color:var(--green);font-size:12px;letter-spacing:.16em;text-transform:uppercase}nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:38px}a.card{display:block;padding:20px;border:1px solid var(--line);border-radius:18px;background:#fffefa;color:var(--ink);text-decoration:none}a.card:hover{border-color:var(--green)}a.card strong{display:block;font-size:18px}a.card span{color:var(--muted);font-size:14px}footer{margin-top:54px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}@media(max-width:520px){main{padding-top:48px}nav{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <div class="eyebrow">EasyLove · CHAT KEYBOARD</div>
  <h1>把常用表达，<br>放进键盘里。</h1>
  <p>EasyLove 键盘提供中英文输入、常用句子、场景话术、原创皮肤和个人表情素材。查看使用帮助与隐私说明。</p>
  <nav aria-label="帮助与隐私页面">
    <a class="card" href="./privacy/"><strong>隐私政策</strong><span>了解资料处理、保存和删除方式</span></a>
    <a class="card" href="./support/"><strong>帮助与支持</strong><span>键盘启用、输入、模板和购买帮助</span></a>
  </nav>
  <footer>运营者：武汉理性筑梦网络科技有限公司</footer>
</main></body></html>
